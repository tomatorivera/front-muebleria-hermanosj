<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - Mueblería Jermanos Jota</title>

  <link rel="stylesheet" href="../css/carrito.css">
</head>

<body>
  <main>
    <section aria-labelledby="cart-title">
      <p>Carrito</p>
      <h1 id="cart-title">Tu selección</h1>
    </section>

    <section aria-label="Productos agregados al carrito">

      <ul id="product-list">
        <li>
          <p>No se han agregado productos al carrito</p>
          <a href="catalogo.html">Visitar catálogo</a>

      </ul>

      <section aria-labelledby="summary-title">
        <div>
          <h2 id="summary-title">Total</h2>
          <p>$ 3.560.000</p>
        </div>

        <p>El envío y armado se cotizan según domicilio al confirmar el pedido.</p>

        <div>
          <button>Confimar compra</button>
          <button>Vaciar carrito</button>
        </div>

    </section>

</html>
